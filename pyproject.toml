[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facg"
version = "0.1.0"
description = "Frequency Analysis of CPU and GPU mixed computing — a GPU-accelerated iterative prewhitening frequency analysis tool inspired by SigSpec."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Niu Hubiao"},
]
keywords = ["frequency-analysis", "sigspec", "gpu", "astronomy", "time-series"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "matplotlib>=3.5",
    "pandas>=1.5",
    "openpyxl>=3.0",
    "astropy>=5.0",
]

[project.scripts]
facg = "facg.__main__:main"

[tool.setuptools.packages.find]
include = ["facg*"]
